name: Deploy Teaser to Production Domain

on:
  push:
    branches: [ teaser ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for production (Teaser)
      run: |
        # Replace main files with teaser versions
        cp src/App-teaser.tsx src/App.tsx
        cp src/main-teaser.tsx src/main.tsx
        npm run build
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: almabridgeofhope.org
