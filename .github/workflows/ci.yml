name: CI

# Schicht 1 (statisch) aus TESTING.md: läuft bei jedem Pull Request und jedem
# Push auf main. Der Build läuft ohne Secrets, er kann also nichts Echtes
# ansprechen.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statisch:
    name: Lint, Typen, Build, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Dieselbe Version wie im Deploy: beide lesen .nvmrc.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # 63 Warnungen sind der Stand bei Einführung der CI. Mehr dürfen es
        # nicht werden; wer welche behebt, senkt die Zahl hier mit.
        run: npm run lint -- --max-warnings=63

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests
        # vitest, nur src/**/*.test.ts(x) – siehe vitest.config.ts
        run: npm test

      - name: Build ohne Secrets
        # Der Build verlangt die drei EmailJS-Werte (vite.config.ts). Platzhalter genügen,
        # es wird nichts gesendet.
        env:
          VITE_EMAILJS_SERVICE_ID: ci-platzhalter
          VITE_EMAILJS_TEMPLATE_ID: ci-platzhalter
          VITE_EMAILJS_PUBLIC_KEY: ci-platzhalter
        run: npm run build

      - name: Dependency-Audit
        # Blockiert ab "critical". Die übrigen "high"-Funde (vite-imagetools mit
        # sharp, zod) gehen nur per Major-Sprung weg; danach Schwelle "high".
        run: npm audit --audit-level=critical

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Binary statt gitleaks-action: die Action verlangt für Organisationen eine Lizenz.
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - name: Ganze Historie scannen
        # Die Historie ist bei Einführung sauber und in wenigen Sekunden gescannt.
        run: gitleaks git --no-banner --redact .
