name: Newsletter Subscription from Issue

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  subscribe-newsletter:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'newsletter')
    
    steps:
    - name: Extract email from issue
      id: extract
      run: |
        # Extract email from issue title
        EMAIL=$(echo "${{ github.event.issue.title }}" | sed 's/Newsletter Signup: //')
        echo "email=$EMAIL" >> $GITHUB_OUTPUT
        
    - name: Subscribe to newsletter
      env:
        NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}
      run: |
        if [ -z "$NEWSLETTER_ENDPOINT" ]; then
          echo "Warning: NEWSLETTER_ENDPOINT secret not configured. Skipping subscription."
          exit 0
        fi
        
        # Send subscription to newsletter endpoint
        curl -X POST "$NEWSLETTER_ENDPOINT" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "email=${{ steps.extract.outputs.email }}" \
          -d "source=github-issue" \
          --fail --silent --show-error || echo "Failed to subscribe, but continuing..."
        
    - name: Comment on issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Newsletter subscription processed for: ${{ steps.extract.outputs.email }}'
          })
