    <!-- Google Consent Mode v2 - Initialize before gtag.js -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Set default consent state to 'denied' for EEA users

      gtag('consent', 'default', {
        'analytics_storage': 'denied',

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7N715MSVLZ" 
            onerror="console.warn('Failed to load Google Analytics script');"></script>
    <script>
      // Only initialize gtag if the script loaded successfully
      if (typeof gtag !== 'undefined') {
        gtag('js', new Date());
        gtag('config', 'G-7N715MSVLZ', {
          'anonymize_ip': true
        });
      } else {
        // Fallback: try to initialize after a delay if script loads late
        setTimeout(function() {

            });

    </script>
    
    <!-- Global error handler for network errors (including GitHub Pages CDN issues) -->
    <script>
      // Handle network errors that might cause Chrome error code 5
      // This is especially important for GitHub Pages hosted sites
      window.addEventListener('error', function(event) {
        const errorMessage = (event.message || '').toLowerCase();
        const filename = (event.filename || '').toLowerCase();
        const isNetworkError = 
          errorMessage.includes('failed to fetch') ||
          errorMessage.includes('networkerror') ||
          errorMessage.includes('load failed') ||
          errorMessage.includes('err_name_not_resolved') ||
          errorMessage.includes('dns') ||
          errorMessage.includes('timeout') ||
          filename.includes('googletagmanager') ||
          filename.includes('fonts.googleapis') ||
          filename.includes('fonts.gstatic') ||
          filename.includes('github.io') ||
          filename.includes('githubusercontent');
        
        if (isNetworkError) {
          console.warn('[404.html] Network error detected:', {
            message: event.message,
            filename: event.filename
          });
          // Prevent Chrome's error page from showing
          event.preventDefault();
        }
      }, true);
      
      // Handle unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        const reason = (event.reason?.toString() || '').toLowerCase();
        const isNetworkError = 
          reason.includes('failed to fetch') ||
          reason.includes('networkerror') ||
          reason.includes('load failed') ||
          reason.includes('err_name_not_resolved') ||
          reason.includes('dns') ||
          reason.includes('timeout');
        
        if (isNetworkError) {
          console.warn('[404.html] Network rejection detected:', event.reason);
          event.preventDefault();
        }
      });
    </script>

    <!-- SPA Routing Fix for GitHub Pages -->
    <script>
      // Single Page Apps for GitHub Pages
      // This script redirects 404 pages to index.html while preserving the path
      // The path is stored in sessionStorage and will be restored by the main app
      (function() {
        // Only redirect if we're not already on index.html
        if (window.location.pathname !== '/index.html' && window.location.pathname !== '/') {
          var path = window.location.pathname;
          var search = window.location.search;
          var hash = window.location.hash;
          var fullPath = path + search + hash;
          
          // Store the original path in sessionStorage
          sessionStorage.setItem('404-redirect-path', fullPath);
          
          // Use replace to avoid adding to history
          window.location.replace('/index.html' + search + hash);
        } else {
          // If we're already on index.html, check for stored path
          var storedPath = sessionStorage.getItem('404-redirect-path');
          if (storedPath) {
            sessionStorage.removeItem('404-redirect-path');
            // Let React Router handle the navigation
            // Just ensure we're ready
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', function() {
                // React Router will handle this via Handle404Redirect component
              });
            }
          }
        }
      })();
    </script>
